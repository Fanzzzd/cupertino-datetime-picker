name: Release

# Publishes to npm when a version tag is pushed. The package's own
# `prepublishOnly` runs the full check first, so a tag on a red tree fails
# here rather than on the registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing to npm (provenance, no token)
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1; the runner ships older.
      - name: Update npm for trusted publishing
        run: npm install -g npm@11.17.0

      - run: pnpm install --frozen-lockfile

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }

      # No NPM_TOKEN. Publishing authenticates via OIDC trusted publishing.
      - run: npm publish --access public
